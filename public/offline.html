<!doctype html>
<html lang="cs">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#020617" />
    <title>SeePOINT je offline</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: #020617; color: #f8fafc; }
      main { width: min(28rem, calc(100% - 2rem)); text-align: center; }
      img { width: 5rem; height: 5rem; border-radius: 1.25rem; }
      h1 { margin: 1.25rem 0 .5rem; font-size: 1.5rem; }
      p { margin: 0 0 1.25rem; color: #cbd5e1; line-height: 1.6; }
      button { border: 0; border-radius: .9rem; padding: .8rem 1rem; background: #10b981; color: #020617; font-weight: 800; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <img src="/seepoint-app-icon.svg" alt="SeePOINT" />
      <h1>Momentálně jste offline</h1>
      <p>SeePOINT z bezpečnostních důvodů neukládá firemní data do veřejné offline cache. Po obnovení připojení načtěte stránku znovu.</p>
      <button type="button" onclick="location.reload()">Zkusit znovu</button>
    </main>
  </body>
</html>
